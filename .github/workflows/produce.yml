# Renders new episodes and sends them to Telegram for approval.
# Runs when an episode lands in remotion/episodes/queue/ (the daily Claude task puts one there each evening),
# or by hand from the Actions tab: "Run workflow", optionally naming one episode to (re)produce.
name: Produce episodes

on:
  push:
    branches: [main]
    paths: ["remotion/episodes/queue/*.json"]
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode to produce, e.g. remotion/episodes/float-up.json (leave empty to produce the queue)"
        required: false
        default: ""
      flags:
        description: "Extra produce.py flags, e.g. --revoice --resource --no-send"
        required: false
        default: ""

# One produce run at a time. The Telegram listener runs alongside; state/*.json from both is merged
# by scripts/merge_state.py.
concurrency:
  group: produce
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DRAFTS_REGISTRY: state/pending_drafts.json
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: System packages (ffmpeg, audio libs for the Azure voice)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libasound2t64 ca-certificates > /dev/null

      - name: Python packages
        run: pip install -q -r requirements.txt

      # earshot listens to candidate sound effects and picks the best take. It's only needed for
      # episodes whose effects haven't been picked yet; if it can't install, the code-made effects are used.
      - name: Cache earshot models
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: earshot-models-v1
      - name: earshot
        continue-on-error: true
        run: |
          python -m venv .earshot
          .earshot/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          .earshot/bin/pip install -q "earshot @ git+https://github.com/Leonxlnx/earshot" requests
          echo "EARSHOT_PYTHON=$PWD/.earshot/bin/python" >> "$GITHUB_ENV"

      - name: Remotion
        working-directory: remotion
        run: |
          npm ci --no-audit --no-fund
          npx remotion browser ensure

      - name: Produce
        env:
          EPISODE: ${{ inputs.episode }}
          FLAGS: ${{ inputs.flags }}
        run: |
          if [ -n "$EPISODE" ]; then
            # shellcheck disable=SC2086
            python scripts/produce.py "$EPISODE" $FLAGS
          else
            python scripts/produce_queue.py
          fi

      - name: Keep the drafts (release "drafts")
        if: always()
        run: |
          shopt -s nullglob
          files=(output/drafts/*.mp4)
          [ ${#files[@]} -eq 0 ] && exit 0
          gh release view drafts > /dev/null 2>&1 || \
            gh release create drafts --title "Drafts" --notes "Rendered drafts waiting for approval. Managed by the pipeline." --prerelease
          gh release upload drafts "${files[@]}" --clobber

      - name: Save state, voice and timings back to the repo
        if: always()
        run: |
          git config user.name "innovatio-bot"
          git config user.email "innovatio-bot@users.noreply.github.com"
          git config merge.state.driver "python scripts/merge_state.py %O %A %B"
          git add -A state remotion audio content   # node_modules and out/ are git-ignored
          git diff --cached --quiet && exit 0
          git commit -q -m "Produce: update drafts and episode files [skip ci]"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1

      - name: Producer log
        if: always()
        run: cat output/logs/producer.log 2>/dev/null | tail -200 || true
