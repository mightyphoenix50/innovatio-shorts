# Blind voice test: the same lines in several voices, sent to Telegram as Voice A, B, C… with a spoiler answer key.
# Run by hand: Actions → Voice A/B test → Run workflow. Nothing in the repo changes.
name: Voice A/B test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voices:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      AZURE_HD_SPEECH_KEY: ${{ secrets.AZURE_HD_SPEECH_KEY }}
      AZURE_HD_SPEECH_REGION: ${{ secrets.AZURE_HD_SPEECH_REGION }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q requests
      - name: Voice test
        run: python scripts/voice_ab.py
